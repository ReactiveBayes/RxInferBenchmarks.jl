# Hardware registry — human-edited.
# Runners self-identify via the RXBENCH_HARDWARE_ID env var, validated against this file.
# After editing, run `make index` to regenerate the JSON mirrors.
version: 1

hardware:
  - id: github-actions-ubuntu
    label: Default GitHub CI runner
    kind: ci
    os: linux
    arch: x86_64
    notes: Shared CI runner; absolute numbers are noisy, trends are meaningful.

  - id: local-dev
    label: Local development machine
    kind: local
    notes: Fake seed data produced locally (`make bench` / `make bench-quick`); written to the seed tree (`data/seed/`) for UI development only — never the public CI dataset.
